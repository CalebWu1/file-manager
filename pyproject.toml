[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer"
version = "0.1.0"
description = "Local LLM-powered file organiser with interactive TUI and natural language actions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Caleb Wu" }
]
keywords = ["file-organizer", "file-organiser", "llm", "ollama", "tui", "textual", "cli", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pydantic>=2.0",
    "textual>=0.70.0",
    "ollama>=0.3.0",
    "pypdf>=4.0",
    "click>=8.1",
    "send2trash>=1.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "git-filter-repo>=2.40"
]

[project.scripts]
file-organizer = "file_organizer.cli:main"
file-organiser = "file_organizer.cli:main"
folder-organizer = "file_organizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["file_organizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
